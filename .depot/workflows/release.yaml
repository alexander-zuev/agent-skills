# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release skill zips
on:
  push:
    branches: [main]
    paths: ['skills/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build one zip per skill
        run: |
          set -euo pipefail
          mkdir dist
          cd skills
          for dir in */; do
            name="${dir%/}"
            zip -qr "../dist/${name}.zip" "$name"
          done
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest skills" --notes "One zip per skill, for upload to claude.ai."
          fi
          gh release upload latest dist/*.zip --clobber
